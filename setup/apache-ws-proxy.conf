# E-PASSPORT WebSocket proxy for HTTPS (Apache)
#
# Enables wss:// on the same domain as PHP so mobile browsers get instant scan alerts.
# Requires: mod_proxy, mod_proxy_wss enabled in httpd.conf
#
# 1. Uncomment in C:\xampp\apache\conf\httpd.conf:
#    LoadModule proxy_module modules/mod_proxy.so
#    LoadModule proxy_wsc_module modules/mod_proxy_wsc.so
#
# 2. Include this file from httpd.conf or httpd-vhosts.conf (adjust paths if needed):
#    Include "C:/xampp/htdocs/E-PASSPORT/setup/apache-ws-proxy.conf"
#
# 3. In config/realtime.php set:  'ws_path' => 'epassport-ws',
#
# 4. Start Node: cd realtime && npm start  (listens on 127.0.0.1:8081)
#
# 5. Restart Apache

# LAN / local HTTPS (XAMPP with SSL on 443)
ProxyPass        "/E-PASSPORT/epassport-ws"  "ws://127.0.0.1:8081/"
ProxyPassReverse "/E-PASSPORT/epassport-ws"  "ws://127.0.0.1:8081/"

# Production at domain root — use instead of the block above:
# ProxyPass        "/epassport-ws"  "ws://127.0.0.1:8081/"
# ProxyPassReverse "/epassport-ws"  "ws://127.0.0.1:8081/"
