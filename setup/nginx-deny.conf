# Nginx: deny web access to application internals.
# Include these location blocks in the server { } that serves E-PASSPORT.
#
# location ~ ^/(config|database|setup|cron|realtime|includes|vendor)(/|$) {
#     deny all;
#     return 404;
# }
#
# location = /.env { deny all; return 404; }
# location = /.env.example { deny all; return 404; }

location ~ ^/E-PASSPORT/(config|database|setup|cron|realtime|includes|vendor)(/|$) {
    deny all;
    return 404;
}

location = /E-PASSPORT/.env {
    deny all;
    return 404;
}

location = /E-PASSPORT/.env.example {
    deny all;
    return 404;
}
